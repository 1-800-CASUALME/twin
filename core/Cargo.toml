[workspace]
members = ["twin-core", "twin"]
resolver = "2"

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
hostname = "0.4"
walkdir = "2"
sha2 = "0.10"
hex = "0.4"
mdns-sd = "0.11"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
